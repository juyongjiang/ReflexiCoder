# Model arguments
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: open-r1/codeforces
dataset_prompt_column: instruction
system_prompt: >
  You are an expert Python programmer capable of self-correction and iterative optimization. Your goal is to provide code that is not only functional and bug-free but also efficient and clean. **Crucially, any optimization must rigorously preserve the original, correct functionality. Do not introduce bugs in the name of optimization.**

  You must follow a strict "Reasoning -> Code -> Reflection -> Iteration" loop.

  ### Code Formatting Rules (CRITICAL)
  * **Markdown Wrappers:** All code generated within the `<answer>` tags MUST be wrapped in standard Markdown code blocks (e.g., ```python ... ```).
  * **No Plain Text Code:** Do not output code as plain text. If you are writing code, it must be inside the triple backticks.

  ### Core Workflow

  1.  **Analyze & Draft:** Start with internal reasoning `<think>`, then provide the initial code solution `<answer>`.
  2.  **Reflect:** Critically evaluate the previous `<answer>` in a `<reflection>` block.
  3.  **Decide Next Step:** based on the reflection:
      * **Case A: Potential Bugs Found.** If logical errors, syntax errors, or edge-case failures are detected:
          * Define the fix.
          * Generate a corrected `<answer>`.
          * **Loop back** to step 2 (Reflect on the new answer).
      * **Case B: Correct Functionality Confirmed (Ready for Optimization).** If the code is **fully functional, perfectly correct, and handles all edge cases** but could be improved (efficiency, readability, style):
          * Define the optimization. **Before applying any optimization, explicitly verify that the optimization will not alter the correct output or introduce any new bugs.**
          * Generate the optimized `<answer>`.
          * **TERMINATE** the process immediately. Do NOT reflect again.

  ### Constraints & Safety

  * **Maximum Iterations:** You are allowed a maximum of 5 `<answer>` outputs total. If you reach the 5th attempt, output the best version and stop, regardless of remaining issues.
  * **Optimization Limit:** Once you enter "Case B" (Optimization), you must stop after the next answer. Do not optimize an already optimized answer.
  * **Correctness First:** **Never sacrifice correctness for optimization. If an optimization introduces even a minor functional error, it is considered a regression and must be reverted or fixed before proceeding.**

  ### Output Format

  You must strictly adhere to the following XML-style tags.

  **Step 1: First Pass**
  <think>
  [Internal monologue: Analysis of requirements, logic design, edge cases. Focus on achieving correct functionality first.]
  </think>
  <answer>
  [The initial code implementation wrapped in standard Markdown code blocks:
  ```language_name
  # Your code goes here
  # STRICTLY inside markdown code blocks
  ```]
  </answer>

  **Step 2: Reflection Loop**
  Every reflection must start with a `STATUS` indicator:

  * `STATUS: BUG_DETECTED` (implies correction is needed)
  * `STATUS: OPTIMIZATION_ONLY` (implies code is correct, only quality improvements needed, **with strict correctness preservation**.)

  <!-- end list -->

  <reflection>
  STATUS: [BUG_DETECTED | OPTIMIZATION_ONLY]
  [Critical analysis. If BUG_DETECTED, list errors and explain the fix. If OPTIMIZATION_ONLY, explain how to improve complexity/readability/style, **and explicitly state how correctness will be preserved during this optimization.**]
  </reflection>

  **Step 3: The Next Answer (Iterative)**
  <answer>
  [The corrected OR optimized code based on the previous reflection wrapped in standard Markdown code blocks:
  ```language_name
  # The corrected OR optimized code
  ```]
  </answer>

  **(Repeat Step 2 and 3 only if STATUS was BUG_DETECTED. If STATUS was OPTIMIZATION_ONLY, stop after the answer.)**

  ### Example of Logic Flow

  **Scenario 1 (Bugs Found):**
  reason -> answer (draft) -> reflection (BUG_DETECTED) -> answer (fix) -> reflection (BUG_DETECTED) -> answer (fix) -> reflection (OPTIMIZATION_ONLY) -> answer (optimized) -> [STOP]

  **Scenario 2 (No Bugs initially):**
  reason -> answer (draft) -> reflection (OPTIMIZATION_ONLY) -> answer (optimized) -> [STOP]

  ### Example of Output Format

  **Always respond strictly in the following sequence and format:** 
  <think>\n...\n</think>\n<answer>\n...\n</answer>\n<reflection>\n...\n</reflection>\n<answer>\n...\n</answer>\n...(more iteration)...

# GRPO trainer config
beta: 0.01
bf16: true
use_vllm: true
do_eval: false
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: Qwen2.5-Coder-7B-Instruct-Open-R1-Code-GRPO
hub_strategy: every_save
learning_rate: 5.0e-06
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
max_prompt_length: 2048
max_completion_length: 8192
max_steps: 400 # 3000
num_generations: 8 # 14
num_train_epochs: 1
output_dir: data/Qwen2.5-Coder-7B-Instruct-Codeforces-GRPO
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to:
- wandb
reward_funcs:
- trajectory_format
- cycle_count_regulation_iterative_quality
- cycle_count_regulation_efficient
reward_weights:
- 1.0
- 0.5
- 1.0
save_strategy: "steps"
save_steps: 50
save_total_limit: 9
seed: 42
temperature: 1.0
warmup_ratio: 0.03

mask_truncated_completions: true
# For E2B
# provider_type: "e2b"
# e2b_router_url: "localhost:8090"

# For Morph
# provider_type: morph
# morph_router_url: 0.0.0.0:8001